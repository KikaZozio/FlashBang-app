name: Construire et publier une nouvelle version

# Se declenche automatiquement quand tu pousses un tag "vX.Y.Z" (ex. :
#   git tag v1.1.0
#   git push origin v1.1.0
# ) : construit les 3 installateurs (Windows/macOS/Linux) en parallele sur
# les machines gratuites fournies par GitHub, PUIS les publie automatiquement
# dans une "Release" GitHub - c'est cette Release que l'app va detecter
# elle-meme au demarrage (voir src/mises_a_jour.py).
#
# "workflow_dispatch" permet aussi de lancer une construction de test a la
# main depuis l'onglet "Actions" du depot (bouton "Run workflow"), sans tag -
# dans ce cas les 3 installateurs sont construits mais RIEN n'est publie (la
# publication est reservee aux vrais tags de version, voir le job "publier").
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------
  # Windows : exe + installateur Inno Setup
  # --------------------------------------------------------------------
  construire-windows:
    runs-on: windows-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Inno Setup
        run: choco install innosetup --no-progress -y

      # CI est deja definie automatiquement par GitHub Actions sur tous ses
      # runners - build_installateur.bat s'en sert pour sauter tous les
      # "pause" (qui bloqueraient indefiniment une execution automatisee)
      - name: Construire l'installateur (build_installateur.bat)
        shell: cmd
        run: build_installateur.bat

      # le nom exact contient le numero de version (ex.
      # FlashBang_Windows_1.1.0.exe) - un joker (*) evite d'avoir a le
      # recalculer ici, GitHub Actions trouve le fichier tout seul
      - name: Publier le resultat
        uses: actions/upload-artifact@v4
        with:
          name: FlashBang-Windows
          path: installer_output/FlashBang_Windows_*.exe

  # --------------------------------------------------------------------
  # macOS : app + .dmg
  # --------------------------------------------------------------------
  construire-macos:
    # "macos-latest" pointe vers une machine Apple Silicon (arm64) depuis
    # 2024 : un .app construit dessus ne demarre pas du tout sur un Mac Intel
    # (plantage immediat, sans message clair - c'est le bug remonte). On
    # epingle donc "macos-13", la derniere image Intel (x86_64) encore
    # disponible chez GitHub : un .app x86_64 tourne nativement sur les Mac
    # Intel ET sur les Mac Apple Silicon via Rosetta 2 (transparent, deja
    # installe sur la plupart des Mac recents, ou propose en un clic sinon)
    # - ca couvre donc tous les Mac, dans les deux sens.
    runs-on: macos-13
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Construire le .dmg (build_dmg.sh)
        run: bash build_dmg.sh

      - name: Publier le resultat
        uses: actions/upload-artifact@v4
        with:
          name: FlashBang-macOS
          path: installateur_macos/FlashBang_macOS_*.dmg

  # --------------------------------------------------------------------
  # Linux : AppImage
  # --------------------------------------------------------------------
  construire-linux:
    # version epinglee (pas "ubuntu-latest") : QtWebEngine a besoin de
    # bibliotheques systeme (libnss3, libasound2...) dont le nom de paquet
    # change entre versions d'Ubuntu (ex. libasound2 vs libasound2t64) -
    # epingler evite qu'une future mise a jour du runner "ubuntu-latest"
    # casse silencieusement cette etape.
    runs-on: ubuntu-22.04
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances systeme (QtWebEngine + FUSE pour appimagetool)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libfuse2 libnss3 libasound2 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libxkbcommon0

      - name: Construire l'AppImage (build_appimage.sh)
        run: bash build_appimage.sh

      - name: Publier le resultat
        uses: actions/upload-artifact@v4
        with:
          name: FlashBang-Linux
          path: installateur_linux/FlashBang_Linux_*.AppImage

  # --------------------------------------------------------------------
  # Publication : uniquement si ce workflow a ete declenche par un vrai tag
  # de version (pas par un lancement manuel de test)
  # --------------------------------------------------------------------
  publier:
    needs: [construire-windows, construire-macos, construire-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # necessaire pour que ce job ait le droit de creer une Release : par
    # defaut, un nouveau depot GitHub ne donne qu'un acces en LECTURE au
    # jeton automatique des workflows (GITHUB_TOKEN) - sans cette ligne,
    # l'etape "Publier la Release GitHub" ci-dessous echouerait avec une
    # erreur 403 (permission refusee), meme si les 3 constructions reussissent
    permissions:
      contents: write
    steps:
      - name: Recuperer les 3 installateurs construits ci-dessus
        uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Publier la Release GitHub avec les 3 fichiers attaches
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artefacts/FlashBang-Windows/FlashBang_Windows_*.exe
            artefacts/FlashBang-macOS/FlashBang_macOS_*.dmg
            artefacts/FlashBang-Linux/FlashBang_Linux_*.AppImage
